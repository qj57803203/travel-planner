<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书登录 - 旅行规划 Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
    .container { max-width: 520px; margin: 40px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 12px; padding: 32px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .btn { background: #ff2442; color: #fff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #e61e3a; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #666; margin-left: 12px; }
    .btn-secondary:hover { background: #555; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
    .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .status.error { display: block; background: #ffebee; color: #c62828; }
    .status.info { display: block; background: #e3f2fd; color: #1565c0; }
    .hint { background: #fff8e1; border-left: 4px solid #ffc107; padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 16px 0; font-size: 14px; }
    .qr-area { text-align: center; margin: 20px 0; }
    .qr-area img { max-width: 280px; border: 2px solid #e0e0e0; border-radius: 8px; }
    .steps { text-align: center; color: #666; font-size: 14px; margin-top: 16px; }
    .steps p { margin-bottom: 4px; }
    .countdown { color: #ff2442; font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔐 小红书登录</h1>
      <p class="subtitle">旅行规划 Agent 需要小红书登录态来搜索攻略笔记。Cookie 有效期约 7-30 天。</p>

      <!-- 状态区域 -->
      <div id="status" class="status"></div>

      <!-- 已登录状态 -->
      <div id="logged-in" style="display: none; text-align: center; padding: 20px 0;">
        <p style="font-size: 48px;">✅</p>
        <p style="font-size: 18px; margin-top: 12px;">小红书已登录</p>
        <p style="color: #666; margin-top: 8px;">Cookie 有效，可正常搜索攻略</p>
      </div>

      <!-- 未登录：获取二维码 -->
      <div id="login-section">
        <div class="hint">💡 点击下方按钮获取二维码，用手机小红书 App 扫码登录</div>

        <div style="text-align: center; margin: 20px 0;">
          <button class="btn" id="getQrBtn" onclick="getQrcode()">📱 获取登录二维码</button>
        </div>

        <!-- 二维码展示区域（获取后显示） -->
        <div id="qr-section" style="display: none;">
          <div class="qr-area">
            <img id="qr-img" src="" alt="登录二维码">
          </div>
          <div class="steps">
            <p>1. 打开小红书 App</p>
            <p>2. 点击右上角「+」→「扫一扫」</p>
            <p>3. 扫描上方二维码</p>
            <p class="countdown" id="countdown"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 说明 -->
    <div class="card">
      <h2>ℹ️ 说明</h2>
      <ul style="padding-left: 20px; color: #666; font-size: 14px;">
        <li>二维码有效期约 4 分钟，超时需重新获取</li>
        <li>扫码登录后 Cookie 自动保存，无需手动操作</li>
        <li>Cookie 有效期约 7-30 天，过期后重新扫码即可</li>
        <li>登录态仅存储在服务器本地，不会上传到第三方</li>
      </ul>
    </div>
  </div>

  <script>
    let countdownTimer = null;
    let pollTimer = null;

    // 页面加载时检查登录状态
    checkLoginStatus();

    async function checkLoginStatus() {
      const status = document.getElementById('status');
      try {
        const resp = await fetch('/api/xhs-login-status');
        const data = await resp.json();

        if (data.logged_in) {
          document.getElementById('logged-in').style.display = 'block';
          document.getElementById('login-section').style.display = 'none';
          status.className = 'status success';
          status.textContent = '✅ ' + (data.message || '已登录');
        } else {
          document.getElementById('logged-in').style.display = 'none';
          document.getElementById('login-section').style.display = 'block';
          status.className = 'status info';
          status.textContent = '⚠️ ' + (data.message || '未登录，请扫码登录');
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = '❌ 检查登录状态失败：' + e.message;
      }
    }

    async function getQrcode() {
      const btn = document.getElementById('getQrBtn');
      const status = document.getElementById('status');
      const qrSection = document.getElementById('qr-section');

      btn.disabled = true;
      btn.textContent = '获取中...';
      status.className = 'status info';
      status.textContent = '⏳ 正在启动浏览器获取二维码（可能需要 10-20 秒）...';

      try {
        const resp = await fetch('/api/xhs-qrcode');
        const data = await resp.json();

        if (data.already_logged_in) {
          // 已登录，刷新状态
          document.getElementById('logged-in').style.display = 'block';
          document.getElementById('login-section').style.display = 'none';
          status.className = 'status success';
          status.textContent = '✅ 已登录，无需扫码';
          return;
        }

        if (!resp.ok) {
          throw new Error(data.detail || '获取二维码失败');
        }

        // 显示二维码
        document.getElementById('qr-img').src = data.qrcode;
        qrSection.style.display = 'block';
        status.className = 'status info';
        status.textContent = '📱 请用手机小红书 App 扫描二维码';

        // 倒计时
        startCountdown(data.timeout || 240);

        // 轮询登录状态
        startPolling();

      } catch (e) {
        status.className = 'status error';
        status.textContent = '❌ ' + e.message;
        qrSection.style.display = 'none';
      } finally {
        btn.disabled = false;
        btn.textContent = '📱 获取登录二维码';
      }
    }

    function startCountdown(seconds) {
      const el = document.getElementById('countdown');
      if (countdownTimer) clearInterval(countdownTimer);

      let remaining = seconds;
      el.textContent = `二维码有效时间：${remaining} 秒`;

      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          el.textContent = '二维码已过期，请重新获取';
          stopPolling();
        } else {
          el.textContent = `二维码有效时间：${remaining} 秒`;
        }
      }, 1000);
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const resp = await fetch('/api/xhs-login-status');
          const data = await resp.json();
          if (data.logged_in) {
            // 登录成功！
            stopPolling();
            if (countdownTimer) clearInterval(countdownTimer);

            document.getElementById('logged-in').style.display = 'block';
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('qr-section').style.display = 'none';

            const status = document.getElementById('status');
            status.className = 'status success';
            status.textContent = '✅ 登录成功！Cookie 已自动保存';
          }
        } catch (e) {
          console.log('轮询登录状态失败:', e);
        }
      }, 3000);  // 每 3 秒检查一次
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }
  </script>
</body>
</html>
