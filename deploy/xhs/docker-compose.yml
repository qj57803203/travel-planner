services:
  xiaohongshu-mcp:
    # Docker Hub 镜像（国内直连慢 / 易失败）
    # image: xpzouying/xiaohongshu-mcp
    # 阿里云镜像源（国内拉取更快）
    image: crpi-hocnvtkomt7w9v8t.cn-beijing.personal.cr.aliyuncs.com/xpzouying/xiaohongshu-mcp
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    tty: true
    volumes:
      - ./data:/app/data        # 持久化 cookies 与运行数据（勿提交到 git）
    environment:
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CONFIG_HOME=/app/data/config
      - AUTH_TOKEN=${AUTH_TOKEN:-}   # 可选鉴权，默认关闭
    ports:
      - "127.0.0.1:18060:18060"     # 只绑定本机，避免公网暴露
