services:
  # ── Chrome（小红书 + 携程共用）──────────────────────────
  # 后端通过 network_mode 共享此容器的网络，直连 localhost:9223
  chrome:
    image: chromedp/headless-shell:latest
    container_name: travel-chrome
    restart: unless-stopped
    # 端口由后端容器通过共享网络暴露，这里不需要 expose/ports
    networks:
      - app-net

  # ── 后端 FastAPI ──────────────────────────────────────
  # 共享 Chrome 容器的网络命名空间，可直连 localhost:9223
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: travel-backend
    restart: unless-stopped
    # 共享 Chrome 的网络命名空间
    network_mode: "service:chrome"
    volumes:
      - ./data/trips.db:/app/trips.db
      - ./xhs/data:/app/xhs_data
    env_file:
      - ./backend.env
    environment:
      # 直连 Chrome 的 localhost:9223（因为共享网络命名空间）
      - CHROME_DEBUG_URL=http://127.0.0.1:9223
      - REMOTE_BROWSER=1
    depends_on:
      - chrome

  # ── 前端（Nginx 托管）──────────────────────────────────
  # 反向代理 API 到后端：通过 Chrome 容器名 + 8000 端口访问（共享网络）
  frontend:
    image: nginx:alpine
    container_name: travel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chrome  # 后端在 Chrome 的网络里，前端通过 Chrome 容器名访问
    networks:
      - app-net

  # ── 小红书 MCP（可选，仅作为 fallback）────────────────────
  xiaohongshu-mcp:
    image: crpi-hocnvtkomt7w9v8t.cn-beijing.personal.cr.aliyuncs.com/xpzouying/xiaohongshu-mcp
    container_name: xiaohongshu-mcp
    profiles:
      - mcp
    restart: unless-stopped
    tty: true
    volumes:
      - ./xhs/data:/app/data
    environment:
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CONFIG_HOME=/app/data/config
    expose:
      - "18060"
    networks:
      - app-net

  # ── 小红书登录浏览器（按需启动）────────────────────────
  xhs-browser:
    image: dorowu/ubuntu-desktop-lxde-vnc:latest
    container_name: xhs-browser
    profiles:
      - login
    ports:
      - "6080:80"
    volumes:
      - ./xhs/browser-data:/root
      - ./xhs/data:/app/xhs_data
      - ../backend/app/tools/xhs_login.py:/app/xhs_login.py:ro
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-xhs123}
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
